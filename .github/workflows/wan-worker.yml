name: build-wan-worker
on:
  push:
    branches: [chip/wan-worker, main]
    paths: ['wan-worker/**', '.github/workflows/wan-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./wan-worker
          push: true
          tags: ghcr.io/optinflow/wan-serverless-worker:latest

