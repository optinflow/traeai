<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade Hub - Minesweeper Ultra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../shared/core.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #38bdf8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --danger: #ef4444;
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        body { background-color: var(--bg-color); color: var(--text-primary); user-select: none; }
        .glass-panel { background: var(--panel-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); }
        .emoji-btn { transition: transform 0.1s; cursor: pointer; }
        .emoji-btn:active { transform: scale(0.9); }
        canvas { border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-lg">
        <!-- Back Button -->
        <a href="../../index.html" class="inline-flex items-center gap-2 text-slate-400 hover:text-white mb-6 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            Back to Hub
        </a>

        <div class="glass-panel rounded-3xl p-8 shadow-2xl">
            <header class="text-center mb-8">
                <h1 class="text-2xl font-bold tracking-widest text-sky-400 uppercase mb-6">Minesweeper Ultra</h1>
                
                <div class="flex justify-between items-center bg-slate-900/50 rounded-2xl p-4 mb-6">
                    <div class="flex flex-col items-center px-4">
                        <span class="text-[10px] text-slate-500 font-bold uppercase tracking-tighter">Mines</span>
                        <span id="mine-count" class="text-2xl font-mono font-bold text-sky-400">000</span>
                    </div>
                    
                    <div id="reset-btn" class="text-4xl emoji-btn">😊</div>
                    
                    <div class="flex flex-col items-center px-4">
                        <span class="text-[10px] text-slate-500 font-bold uppercase tracking-tighter">Time</span>
                        <span id="timer" class="text-2xl font-mono font-bold text-sky-400">000</span>
                    </div>
                </div>

                <div class="flex gap-2 justify-center">
                    <button class="diff-btn px-4 py-2 rounded-xl text-xs font-bold border border-white/10 hover:bg-white/5 transition-all" data-level="easy">EASY</button>
                    <button class="diff-btn px-4 py-2 rounded-xl text-xs font-bold border border-white/10 hover:bg-white/5 transition-all" data-level="medium">MEDIUM</button>
                    <button class="diff-btn px-4 py-2 rounded-xl text-xs font-bold border border-white/10 hover:bg-white/5 transition-all" data-level="hard">HARD</button>
                </div>
            </header>

            <div class="flex justify-center bg-slate-900/30 rounded-2xl p-4 overflow-hidden">
                <canvas id="gameCanvas"></canvas>
            </div>

            <footer class="mt-8 text-center">
                <p class="text-slate-500 text-xs font-medium uppercase tracking-widest">Left Click: Reveal • Right Click: Flag</p>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
